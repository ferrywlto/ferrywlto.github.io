<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">README activity update flow</title>
  <desc id="desc">Medium and Stack Overflow activity flow into a C# Docker GitHub Action, which updates marked sections of a README file.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#85dfc4"/>
    </marker>
  </defs>
  <rect width="960" height="480" rx="24" fill="#152c35"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="64" fill="#85dfc4" font-size="22" letter-spacing="3">GITHUB ACTION</text>
    <text x="48" y="116" fill="#f4f8fa" font-size="34" font-weight="700">Turn recent activity into a current README.</text>

    <g fill="#203e49" stroke="#4e7885" stroke-width="2">
      <rect x="48" y="176" width="190" height="156" rx="16"/>
      <rect x="385" y="176" width="190" height="156" rx="16"/>
      <rect x="722" y="176" width="190" height="156" rx="16"/>
    </g>
    <g fill="#f4f8fa" font-size="27" font-weight="700" text-anchor="middle">
      <text x="143" y="224">Activity</text>
      <text x="480" y="224">C# action</text>
      <text x="817" y="224">README</text>
    </g>
    <g fill="#c7dae0" font-size="20" text-anchor="middle">
      <text x="143" y="264">Medium stories</text>
      <text x="143" y="294">Stack Overflow</text>
      <text x="480" y="264">Load, format,</text>
      <text x="480" y="294">replace markers</text>
      <text x="817" y="264">Only marked</text>
      <text x="817" y="294">sections change</text>
    </g>
    <g stroke="#85dfc4" stroke-width="3" marker-end="url(#arrow)">
      <path d="M 264 254 H 359"/>
      <path d="M 601 254 H 696"/>
    </g>
    <text x="480" y="417" text-anchor="middle" fill="#85dfc4" font-family="monospace" font-size="23">Docker container · GitHub Actions · explicit markers</text>
  </g>
</svg>
